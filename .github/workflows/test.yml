name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ubuntu runner đã có Google Chrome; test tự tìm qua tools/chrome.mjs
      - run: npm ci
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: packages/flutter
      - run: flutter analyze
        working-directory: packages/flutter
      - run: flutter test
        working-directory: packages/flutter
      - run: flutter pub get
        working-directory: examples/flutter
      - run: flutter analyze
        working-directory: examples/flutter

  flutter-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: packages/flutter_3d
      - run: flutter analyze
        working-directory: packages/flutter_3d
      - run: flutter test
        working-directory: packages/flutter_3d
      # importer chính thức của flutter_scene phải nhận được model (animation, skin, extension)
      - run: |
          for f in bipbip bipbip_lod1 bipbip_lod2; do
            dart run flutter_scene:import -i assets/mascot/$f.glb -o /tmp/$f.fsceneb
          done
        working-directory: packages/flutter_3d
