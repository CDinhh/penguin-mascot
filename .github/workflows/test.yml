name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ubuntu runner đã có Google Chrome; test tự tìm qua tools/chrome.mjs
      - run: npm ci
      - run: npm test
