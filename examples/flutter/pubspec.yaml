name: penguin_mascot_example
description: Ví dụ dùng penguin_mascot, đủ 15 trạng thái.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.28.0"

dependencies:
  flutter:
    sdk: flutter
  penguin_mascot:
    path: ../../packages/flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # file Rive (bản chép của rive/bipbip.riv)
    - assets/mascot/bipbip.riv
    # sprite sheet dự phòng: npm run export:frames -- --out examples/flutter/assets/mascot, rồi khai thư mục
    # - assets/mascot/
